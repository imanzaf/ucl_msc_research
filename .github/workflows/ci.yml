name: V9 offline validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      CI_PAID_API_CALLS_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --all-groups --frozen
      - name: Black
        run: uv run black --check configs scripts src tests
      - name: isort
        run: uv run isort --check-only configs scripts src tests
      - name: Flake8
        run: uv run flake8 configs scripts src tests
      - name: mypy
        run: uv run mypy configs scripts src
      - name: Export and compare schemas
        run: |
          uv run python scripts/export_v9_schemas.py
          git diff --exit-code -- schemas/v9
      - name: Seed and protocol validation
        run: uv run python scripts/validate_v9_protocol.py
      - name: Documentation smoke test
        run: uv run python scripts/docs_smoke_test.py
      - name: Pytest, including Streamlit and simulated analysis
        run: uv run pytest

  r-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.1.3"
      - name: Install renv bootstrap
        run: Rscript -e 'install.packages("renv", repos="https://cloud.r-project.org")'
      - name: Restore complete locked R graph
        run: Rscript -e 'renv::restore(project="analysis/r", prompt=FALSE)'
      - name: Parse and smoke-fit locked robustness models
        working-directory: analysis/r
        run: |
          Rscript -e 'parse(file="run_mixed_models.R")'
          Rscript smoke_test.R
