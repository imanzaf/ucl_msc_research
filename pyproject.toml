[project]
name = "ucl-msc-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.72.0",
    "bibtexparser>=1.4.4",
    "httpx>=0.28.1",
    "openai>=2.2.0",
    "openpyxl>=3.1.5",
    "playwright>=1.48.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.1",
    "pytest>=9.1.1",
]

[dependency-groups]
dev = [
    "black>=24.8.0",
    "flake8>=5.0.4",
    "isort>=5.13.2",
    "pre-commit>=3.5.0",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
