[project]
name = "ucl-msc-research"
version = "0.1.0"
description = "Reproducible evaluation of selective and directional communication by financial-assistant language models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "openai>=2.2.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.1",
    "scipy>=1.17.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
script-files = ["scripts/risk-comm"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.settings" = ["models.json"]

[dependency-groups]
dev = [
    "black>=24.8.0",
    "flake8>=5.0.4",
    "isort>=5.13.2",
    "mypy>=2.3.0",
    "pre-commit>=3.5.0",
    "pytest>=9.1.1",
]

[tool.black]
line-length = 150
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 150

[tool.mypy]
python_version = "3.11"
files = ["scripts", "src", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tex_src"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "scipy.*"]
ignore_missing_imports = true
